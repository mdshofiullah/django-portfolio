<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Shofi Portfolio</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Swiper CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/swiper/swiper-bundle.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <!-- Theme CSS -->
    <link id="theme-style" rel="stylesheet" type="text/css" href="" />
    <!-- particles js -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  </head>
  <body>
    <!-- Theme Switcher -->
    <div class="theme-switcher">
      <div class="theme-dot" id="light-dot" data-theme="light">
        <span class="theme-label">Light Theme</span>
      </div>
      <div class="theme-dot" id="dark-dot" data-theme="dark">
        <span class="theme-label">Dark Theme</span>
      </div>
    </div>

    <!-- Mobile Theme Switcher -->
    <div class="mobile-theme-switcher">
      <div class="theme-dot" id="mobile-light-dot" data-theme="light"></div>
      <div class="theme-dot" id="mobile-dark-dot" data-theme="dark"></div>
    </div>

    <!-- Particles Background -->
    <div id="particles-js"></div>

    {% include 'base/navbar.html' %} {% block content %} {% endblock %}

    <!-- Scripts -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>
